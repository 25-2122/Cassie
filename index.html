<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Cassie ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100-vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Quicksand', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 90%;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #d63384;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            font-weight: 600;
        }

        .yes-btn {
            background-color: #ff4d6d;
            color: white;
        }

        .yes-btn:hover {
            background-color: #ff758f;
            transform: scale(1.1);
        }

        .no-btn {
            background-color: #6c757d;
            color: white;
        }

        /* Celebration Styles */
        .hidden { display: none; }
        
        .celebration h1 { color: #ff006e; }
        .confetti { font-size: 3rem; margin: 10px; }
    </style>
</head>
<body>

    <!-- Main Question Page -->
    <div id="question-page" class="container">
        <h1>Hey Cassie, will you be my girlfriend? 🌹</h1>
        <div class="buttons">
            <button class="yes-btn" onclick="showCelebration()">Yes!</button>
            <button class="no-btn" onclick="showFunny()">No</button>
        </div>
    </div>

    <!-- Success Page -->
    <div id="success-page" class="container hidden celebration">
        <h1>Congratulations! 🎉</h1>
        <p style="font-size: 1.5rem; color: #555;">You are now officially Jesse's girl! ❤️</p>
        <div class="confetti">🥳💖✨👑</div>
    </div>

    <!-- Funny "No" Page -->
    <div id="funny-page" class="container hidden">
        <h1>Nice try! 😂</h1>
        <p style="font-size: 1.5rem; color: #555;">Sorry, you can't say no giirlll! 💅✨</p>
        <button class="yes-btn" style="margin-top: 20px;" onclick="showQuestion()">Try again (Say Yes 😉)</button>
    </div>

    <script>
        function showCelebration() {
            document.getElementById('question-page').classList.add('hidden');
            document.getElementById('funny-page').classList.add('hidden');
            document.getElementById('success-page').classList.remove('hidden');
            document.body.style.background = "linear-gradient(to right, #ff006e, #8338ec)";
        }

        function showFunny() {
            document.getElementById('question-page').classList.add('hidden');
            document.getElementById('funny-page').classList.remove('hidden');
        }

        function showQuestion() {
            document.getElementById('funny-page').classList.add('hidden');
            document.getElementById('question-page').classList.remove('hidden');
        }
    </script>
</body>
</html>
