<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wait... You again? 🤔</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Quicksand:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8f9fa;
            font-family: 'Quicksand', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        /* Fun colorful background pattern */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #e5e5f7;
            opacity: 0.8;
            background-image:  radial-gradient(#ff4d6d 0.5px, transparent 0.5px), radial-gradient(#ff4d6d 0.5px, #e5e5f7 0.5px);
            background-size: 20px 20px;
            background-position: 0 0,10px 10px;
        }

        .card {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: 0 20px 0px #6c757d;
            border: 4px solid #343a40;
            max-width: 500px;
            width: 90%;
            transform: rotate(-1deg);
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: #ff4d6d;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #343a40;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #343a40;
            margin-top: 10px;
            font-weight: bold;
        }

        p {
            font-size: 1.2rem;
            color: #555;
            margin: 2rem 0;
            line-height: 1.5;
        }

        .funny-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: #343a40;
            color: white;
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            background: #ff4d6d;
            transform: scale(1.05) rotate(1deg);
        }

        .emoji-float {
            font-size: 3rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="card">
        <div class="emoji-float">🧐</div>
        <h1>UH-OH!</h1>
        <div class="subtitle">Look who’s back...</div>
        
        <p>I thought we already settled this! Are you lost, or are you just obsessed with clicking this link? 😂</p>

        <div class="funny-options">
            <button class="btn" onclick="alert('We know you love Jesse, but get a life! 🤣')">I just miss the pink background</button>
            <button class="btn" onclick="alert('Access Denied: You are already Jesse\'s Girl. No refunds! 💅')">I want to change my answer</button>
            <button class="btn" onclick="window.location.href='https://google.com'">I am actually lost, send help</button>
        </div>

        <p style="font-size: 0.9rem; margin-top: 2rem; opacity: 0.7;">
            Warning: Repeated visits may result in excessive blushing.
        </p>
    </div>
</body>
</html>
